name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm ci
      # build + DTCG validation + output contract test + `git diff --exit-code -- dist`,
      # so a stale committed dist/ fails the build.
      - run: npm run check
      # Catches files that would be missing from (or wrongly included in) the
      # published tarball before a release does.
      - run: npm pack --dry-run
